<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Prévia do Arcade</title>
  <desc id="desc">Painel escuro com o nome Arcade e uma grade de jogos documentados no projeto.</desc>
  <rect width="1200" height="700" fill="#10161f"/>
  <rect x="34" y="34" width="1132" height="632" rx="18" fill="#182331" stroke="#e9943a" stroke-width="3"/>
  <text x="78" y="115" fill="#f7f1e7" font-family="Arial, sans-serif" font-size="54" font-weight="700">ARCADE</text>
  <text x="80" y="155" fill="#a9bac7" font-family="Arial, sans-serif" font-size="22">jogos que eu estou reunindo em um só lugar</text>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="80" y="220" width="315" height="150" rx="12" fill="#26394a"/><text x="108" y="282" fill="#f7f1e7">RPG · 2.6.3</text><text x="108" y="322" fill="#e9943a" font-size="18">exploração e evolução</text>
    <rect x="442" y="220" width="315" height="150" rx="12" fill="#26394a"/><text x="470" y="282" fill="#f7f1e7">Xadrez · 2.0</text><text x="470" y="322" fill="#e9943a" font-size="18">jogar contra o computador</text>
    <rect x="804" y="220" width="315" height="150" rx="12" fill="#26394a"/><text x="832" y="282" fill="#f7f1e7">Clicker · 2.0</text><text x="832" y="322" fill="#e9943a" font-size="18">progresso e pontuação</text>
    <rect x="80" y="410" width="315" height="150" rx="12" fill="#26394a"/><text x="108" y="472" fill="#f7f1e7">Cassino Pixel</text><text x="108" y="512" fill="#e9943a" font-size="18">fichas virtuais</text>
    <rect x="442" y="410" width="315" height="150" rx="12" fill="#26394a"/><text x="470" y="472" fill="#f7f1e7">Tower · 2.4</text><text x="470" y="512" fill="#e9943a" font-size="18">defesa e pontuação</text>
    <rect x="804" y="410" width="315" height="150" rx="12" fill="#26394a"/><text x="832" y="472" fill="#f7f1e7">Reflexo Neon</text><text x="832" y="512" fill="#e9943a" font-size="18">demonstração técnica</text>
  </g>
  <text x="80" y="620" fill="#a9bac7" font-family="Arial, sans-serif" font-size="18">prévia feita a partir do catálogo documentado no repositório</text>
</svg>
