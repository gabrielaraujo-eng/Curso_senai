<!DOCTYPE html>
<!-- tag doctype é o tipo do arquivo, HTML  -->
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>INTRODUÇÃO AO HTML E WEB</title>
        <!-- tag title é o titulo que vai na url do site -->

    </head>
    <!-- tag head é a cabeça (normalmente nao se escreve texto) -->
    <body> 
        <P>Olá Mundo!</P>
        <!-- tag p é paragrafo -->

            <h1>
                Meu Nome e: <br> 
                <!-- tag br pula a linha/quebra a linha -->
                <p><b>Gabriel</b></p>

            </h1>
            <!-- tag h1 é o maior tamanho   -->

            <h2>
                Minha idade é: <br>
                <p><b>17</b>17</p> 
                <!-- tag b é negrito -->

            </h2>

            <h3>
                Moro na cidade de: <br>
                <p><i>Limeira</i></p>
                <!-- tag i é italico -->

            </h3>

            <h4>
                Meu curso é: <br>
                <p>Desenvolvimento de Sistema</p> 

            </h4>

            <h5>
                Meu hobby: <br>

            </h5>
            
            <small>O show Começa</small>
            <big>E termina</big>
            <hr>
            <!-- tag hr cria uma linha que corta a tela -->
            <center>
                <!-- tag center centraliza oque esta entre ele -->
            <p><b>nagato09</b></p>
            </center>

            <hr>

            <h6>
                fim <p>end</p> 

            </h6>
            <!-- tag h6 é o menor tamanho -->

    </body>
    <!-- tag body é corpo  -->

</html>
<!-- tag html é onde tudo fica -->


<!-- colocar o paragrafo fora do Hs para funcionar tags de modificação -->
